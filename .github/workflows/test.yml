name: CI 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 语法检查（后端）
        run: |
          for f in server.js src/config.js src/core/*.js src/modules/*/*.js src/seed/*.js scripts/*.js; do
            node --check "$f" || exit 1
          done
      - name: 全量测试
        run: node --test
